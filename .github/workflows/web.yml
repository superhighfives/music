name: Web

# Every pull request that touches web/ deploys its own preview stage, pr-<number>, with its own
# Worker and database, and destroys it when the pull request closes. Pushes to main deploy prod.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

# One run per stage at a time. A deploy is not cancelled halfway, so state stays consistent.
concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # Previews use Clerk's development instance; the production instance only accepts its own domain.
  CLERK_SECRET_KEY: ${{ github.event_name == 'pull_request' && secrets.CLERK_SECRET_KEY_DEV || secrets.CLERK_SECRET_KEY }}
  CLERK_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && secrets.CLERK_PUBLISHABLE_KEY_DEV || secrets.CLERK_PUBLISHABLE_KEY }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Builds with Vite, applies new D1 migrations, then uploads the Worker.
      - run: pnpm exec alchemy deploy --stage "$STAGE" --yes --no-input

  destroy:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec alchemy destroy --stage "$STAGE" --yes --no-input
